# TimeLens-100K duration-first curation defaults.

source:
  name: timelens_100k
  remote_path: /m2v_intern/xuboshen/zgw/data/VideoProxyMixed/TimeLens-100K
  annotation_file: timelens-100k.jsonl
  video_root: video_shards

duration_filter:
  min_duration_sec: 60
  max_duration_sec: 240

sampling:
  per_source: 0
  target_total: 0
  balanced_total: false
  seed: 42

local_score:
  enabled: false
  model: /m2v_intern/xuboshen/models/Qwen3-VL-4B-Instruct
  num_gpus: 1
  tensor_parallel_size: 1

output:
  results_dir: results/timelens_100k
